<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F5F5" />
    <title>C3 Room</title>

    <style>
      :root {
        font-family: Arial, sans-serif;
        color: #222222;
        background: #f5f5f5;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(90%, 420px);
        padding: 32px;
        box-sizing: border-box;
        text-align: center;
        background: #ffffff;
        border: 1px solid #dddddd;
        border-radius: 12px;
      }

      h1 {
        margin-top: 0;
      }

      #status {
        color: #267343;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>C3 Room</h1>
      <p id="status">Checking room status...</p>
      <p>Room ID: <strong id="room-id">Loading...</strong></p>
    </main>

    <script>
      async function loadRoomStatus() {
        const status = document.getElementById("status");
        const roomId = document.getElementById("room-id");

        try {
          const response = await fetch("/api/health");

          if (!response.ok) {
            throw new Error("Server unavailable");
          }

          const room = await response.json();

          status.textContent = "C3 Room server is running.";
          roomId.textContent = room.roomId;
        } catch {
          status.textContent = "Unable to retrieve room status.";
          roomId.textContent = "Unavailable";
        }
      }

      loadRoomStatus();
    </script>
  </body>
</html>
