<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C3 Room</title>
    <link rel="stylesheet" href="css/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/room.css" />
  </head>
  <body>
    <main>
      <!-- Header -->
      <div class="top-bar">
        <div>
          <img
            class="logo"
            id="logo"
            src="assets/images/c3-room-logo.svg"
            alt="logo"
          />
        </div>
        <div>
          <button class="about" id="about">
            <i class="bi bi-info-circle"></i> About
          </button>
        </div>
      </div>

      <!-- Main Page Content -->
      <div class="content">
        <div class="title">
          <p>
            Create a new room to start a local server for others to join or Join
            an active room.
          </p>
        </div>

        <!-- Action Buttons -->

        <div class="actions">
          <div class="create-room-btn" id="create-room-btn">
            <i class="bi bi-house-add"></i>
            <p>Create Room</p>
          </div>

          <div class="join-room-btn" id="join-room-btn">
            <img src="assets/icons/join-room.svg" alt="" />
            <p>Join Room</p>
          </div>
        </div>

        <!-- Brand Info -->
        <div class="info">
          <p id="c3-room-name">C3 ROOM</p>
          <p>Connect · Collaborate · Construct</p>
        </div>
      </div>
    </main>
    <script src="js/room.js"></script>
  </body>
</html>
