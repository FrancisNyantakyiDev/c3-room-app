<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C3 Room</title>
    <link rel="stylesheet" href="../css/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/new-room.css" />
  </head>
  <body>
    <div>
      <!-- Content -->
      <div class="new-room-content">
        <!-- Content Header -->
        <h3 class="content-header">New Room</h3>

        <div>
          <div class="settings-wrapper">
            <p>Get started quickly, Or change settings</p>

            <div>
              <!-- Settings Button -->
              <div class="settings-btns-container">
                <i
                  id="show-settings-btn"
                  class="bi bi-arrow-up-circle-fill"
                ></i>
                <i
                  id="hide-settings-btn"
                  class="bi bi-arrow-down-circle-fill"
                  style="display: none"
                ></i>
              </div>

              <!-- Settings Container-->
              <div id="settings-container" class="settings-container">
                <div class="settings">
                  <p>Chat</p>
                  <select id="chat">
                    <option value="on" selected>On</option>
                    <option value="off">Off</option>
                  </select>
                </div>

                <div class="settings">
                  <p>Present</p>
                  <select id="present">
                    <option value="everyone" selected>Everyone</option>
                    <option value="only-you">Only You</option>
                  </select>
                </div>

                <div class="settings">
                  <p>File upload</p>
                  <select id="file-upload">
                    <option value="everyone" selected>Everyone</option>
                    <option value="only-you">Only You</option>
                  </select>
                </div>

                <div class="settings">
                  <p>Maximum file size</p>
                  <select id="file-size">
                    <option value="50">50MB</option>
                    <option value="100" selected>100MB</option>
                    <option value="200">200MB</option>
                    <option value="300">300MB</option>
                    <option value="500">500MB</option>
                    <option value="1024">1GB</option>
                    <option value="2048">2GB</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="new-room-option">
          <button id="start-btn">Start</button>
        </div>
      </div>
    </div>

    <!-- Active Room Modal-->
    <div id="active-room-modal" class="modal">
      <div id="active-room-container" class="modal-container">
        <h3>Room Active</h3>

        <!-- Modal Content -->
        <div class="active-room-content">
          <div class="room-detail">
            <p>IP Address: <span id="ip-address"></span></p>
            <p>Room ID: <span id="room-id"></span></p>
          </div>
          <div class="qr-code-container">
            <div id="qr-code"></div>
          </div>
        </div>

        <!-- Active Room Options -->
        <div class="room-options">
          <button id="open-room-btn">Open Room</button>
          <button id="quit-room-btn">Quit Room</button>
        </div>

        <!-- Exit Room Confirmation -->
        <div id="confirm-quit-modal" class="confirm-quit-modal">
          <div class="confirm-quit-container">
            <p>Are you sure you want to quit this room for everyone?</p>
            <div class="confirm-quit-btns">
              <button id="cancel-quit-btn">Cancel</button>
              <button id="confirm-quit-btn">Quit Room</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Home Button -->
    <div id="home-btn"><i class="bi bi-house-fill"></i></div>

    <script src="../js/qrcode.min.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/new-room.js"></script>
  </body>
</html>
