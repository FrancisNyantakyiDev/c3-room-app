<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C3 Room</title>
    <link rel="stylesheet" href="../css/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/join-room.css" />
  </head>
  <body>
    <div>
      <!-- Content -->
      <div class="join-room-content">
        <!-- Content Header -->
        <h3 class="content-header">Join Room</h3>

        <div>
          <p>Enter IP Address</p>
          <input
            id="join-room-ip-address"
            type="text"
            placeholder="192.169.10.3:2000"
            autofocus
          />
          <button id="join-room-btn">Connect</button>
        </div>
      </div>
    </div>

    <!-- Home Button -->
    <div id="home-btn"><i class="bi bi-house-fill"></i></div>

    <script src="../js/global.js"></script>
    <script src="../js/join-room.js"></script>
  </body>
</html>
