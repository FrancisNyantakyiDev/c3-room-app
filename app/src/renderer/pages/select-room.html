<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C3 Room</title>
    <link rel="stylesheet" href="../css/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/select-room.css" />
  </head>
  <body>
    <div>
      <!-- Content -->
      <div class="select-room-content">
        <!-- Content Header -->
        <h3 class="content-header">Welcome</h3>

        <!-- Action Buttons -->
        <div class="actions">
          <div class="new-room-btn" id="new-room-btn">
            <i class="bi bi-plus-circle-fill"></i>
            <p>New Room</p>
          </div>

          <div class="join-room-btn" id="join-room-btn">
            <img src="../assets/icons/join-room.svg" alt="Join" />
            <p>Join Room</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Home Button -->
    <div style="display: none" id="home-btn">
      <i class="bi bi-house-fill"></i>
    </div>

    <script src="../js/global.js"></script>
    <script src="../js/select-room.js"></script>
  </body>
</html>
